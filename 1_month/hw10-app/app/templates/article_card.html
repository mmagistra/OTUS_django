<div class="card col-3 text-center d-flex flex-column justify-content-center" style="">
  <div class="card-body d-flex flex-column justify-content-between">
    <div>
      <h5 class="card-title">{{card.title}}</h5>
      <h6 class="card-subtitle mb-2 text-body-secondary">{{card.subtitle}}</h6>
    </div>
    <p class="card-text">{{card.text}}.</p>
    <div class="mb-2 d-flex justify-content-between align-items-end">
      <div class="text-start">
        {% for tag in card.tags %}
          {% if loop.index < 5 %}
            <span class="badge rounded-pill text-bg-info m-0" style="font-size: 10px">
              {{ tag }}
            </span>
          {% endif %}
        {% endfor %}
        </div>
      <a href="../article/{{ card.id }}" class="btn btn-primary col-5">See more</a>
    </div>
  </div>
</div>
