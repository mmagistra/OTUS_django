<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://unpkg.com/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous">
  <title>All articles</title>
</head>
{% if is_light_theme %}
<body>
{% else %}
<body data-bs-theme="dark">
{% endif %}
{% include "nav.html" %}
<div class="d-flex justify-content-center mt-5">
  <h2>Welcome, {{current_user.username}}!</h2>
  <form action="." id="logout_form">
    <button type="submit" class="btn btn-{{ 'light' if is_light_theme else 'dark' }} mx-0">
      <img src="../static/images/{{ 'light' if is_light_theme else 'dark' }}/logout.png" alt="logout" width="30">
    </button>
  </form>
</div>
<script src="https://unpkg.com/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous">
</script>
<script>
</script>

<script>
  document.getElementById('logout_form').onsubmit = event => {
    event.preventDefault(); // Останавливаем стандартное поведение
    document.cookie = 'access_token=undefined; path=/;';
    location.reload();
  };
</script>
</body>
</html>
